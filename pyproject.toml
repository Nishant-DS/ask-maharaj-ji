[project]
name = "ask-maharajji-ingestion"
version = "0.1.0"
description = "Phase 1 ingestion pipeline for Ask Maharaj Ji"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.35",
  "tenacity>=9.0.0",
  "youtube-transcript-api>=1.2.3",
  "yt-dlp>=2025.1.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "logs*", "outputs*", "work*", "transcripts*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
